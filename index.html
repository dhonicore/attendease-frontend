<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoBunk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #151515;
      --ink: #f2f2f2;
      --muted: #9c9c9c;
      --line: #242424;
      --accent: #ff7a1a;
      --accent-soft: rgba(255,122,26,0.14);
      --good: #23d57a;
      --warn: #ffc45b;
      --bad: #ff6767;
      --radius: 18px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, sans-serif; background: var(--bg); color: var(--ink); }
    .wrap { max-width: 980px; margin: 0 auto; padding: 24px 14px 42px; }
    .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .login-card {
      width: min(460px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 34px 28px;
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.38);
      text-align: center;
    }
    .logo { font-size: 13px; font-weight: 800; letter-spacing: 0.22em; color: var(--accent); text-transform: uppercase; }
    .login-card h1 { margin-top: 12px; font-size: 38px; line-height: 1.05; letter-spacing: -0.03em; }
    .muted { color: var(--muted); font-size: 14px; line-height: 1.55; }
    .google {
      margin-top: 20px;
      display: inline-block;
      text-decoration: none;
      background: var(--accent);
      color: #fff;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease;
    }
    .google:hover { transform: translateY(-2px); filter: brightness(1.08); box-shadow: 0 16px 32px rgba(255,122,26,0.28); }
    .google:active { transform: translateY(0); }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
    .top h1 { font-size: clamp(26px, 4vw, 42px); letter-spacing: -0.03em; line-height: 1.05; }
    .hello { margin-top: 8px; }
    .btn {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn:hover { border-color: rgba(255,122,26,0.4); color: #fff; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 12px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .panel:hover {
      border-color: rgba(255,122,26,0.28);
      transform: translateY(-2px);
    }
    .panel h3 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .verdict {
      font-size: clamp(22px, 3.5vw, 34px);
      font-weight: 900;
      letter-spacing: -0.03em;
      margin-bottom: 10px;
    }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin-bottom: 12px; }
    .kpi {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .kpi:hover { transform: translateY(-2px); border-color: rgba(255,122,26,0.32); }
    .kpi small { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
    .kpi strong { display: block; margin-top: 10px; font-size: clamp(24px, 3vw, 32px); line-height: 1; }
    .kpi strong.accent { color: var(--accent); }
    .tabs { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .tab {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--muted);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .tab.active { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
    .tab:hover { border-color: rgba(255,122,26,0.36); color: #fff; transform: translateY(-1px); }
    .tab:active { transform: translateY(0); }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); gap: 10px; }
    .row:hover { background: rgba(255,255,255,0.01); }
    .row:last-child { border-bottom: none; }
    .title { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
    .meta { color: var(--muted); font-size: 13px; }
    .pill { border-radius: 999px; padding: 5px 10px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
    .ok { background: rgba(35,213,122,0.12); color: var(--good); border: 1px solid rgba(35,213,122,0.34); }
    .no { background: rgba(255,103,103,0.12); color: var(--bad); border: 1px solid rgba(255,103,103,0.34); }
    .right { text-align: right; }
    .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
    @media (max-width: 840px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div id="auth" class="login">
    <div class="login-card">
      <div class="logo">NoBunk</div>
      <h1>Know before you bunk.</h1>
      <p class="muted" style="margin-top:10px;">Track attendance, see today's risk, and avoid getting cooked at semester end.</p>
      <a class="google" href="https://attendease-backend-wrag.onrender.com/auth/google">Continue with Google</a>
    </div>
  </div>

  <main id="app" style="display:none;">
    <div class="wrap">
      <div class="top">
        <div>
          <div class="logo">NoBunk</div>
          <h1>Dashboard</h1>
          <div id="hello" class="hello muted"></div>
        </div>
        <button class="btn" onclick="signOut()">Sign Out</button>
      </div>

      <div class="panel">
        <h3>Verdict</h3>
        <div id="verdict" class="verdict">Analyzing...</div>
        <p id="today-summary" class="muted"></p>
      </div>

      <div class="grid">
        <div class="kpi"><small>Overall %</small><strong id="k-overall">--</strong></div>
        <div class="kpi"><small>Total Bunks Left</small><strong id="k-bunks" class="accent">--</strong></div>
        <div class="kpi"><small>Classes Today</small><strong id="k-today">--</strong></div>
        <div class="kpi"><small>Working Days Left</small><strong id="k-days">--</strong></div>
      </div>

      <div class="tabs">
        <button id="tab-today" class="tab active" onclick="switchTab('today')">Today Advice</button>
        <button id="tab-subs" class="tab" onclick="switchTab('subjects')">All Subjects</button>
        <button id="tab-hol" class="tab" onclick="switchTab('holidays')">Upcoming Holidays</button>
      </div>

      <section id="view-today" class="panel"></section>
      <section id="view-subjects" class="panel" style="display:none;"></section>
      <section id="view-holidays" class="panel" style="display:none;"></section>
    </div>
  </main>

<script>
const API = 'https://attendease-backend-wrag.onrender.com';
const p = new URLSearchParams(window.location.search);
const userId = p.get('user_id') || localStorage.getItem('user_id');
if (p.get('user_id')) localStorage.setItem('user_id', p.get('user_id'));
if (p.get('name')) localStorage.setItem('user_name', p.get('name'));

let dashboard = null;
let verdict = null;
let holidays = null;

function switchTab(name) {
  const ids = ['today','subjects','holidays'];
  for (const id of ids) {
    document.getElementById(`tab-${id === 'subjects' ? 'subs' : id === 'holidays' ? 'hol' : 'today'}`).classList.remove('active');
    document.getElementById(`view-${id}`).style.display = 'none';
  }
  document.getElementById(`tab-${name === 'subjects' ? 'subs' : name === 'holidays' ? 'hol' : 'today'}`).classList.add('active');
  document.getElementById(`view-${name}`).style.display = 'block';
}

function signOut() {
  localStorage.clear();
  window.location.href = 'index.html';
}

function renderToday() {
  const el = document.getElementById('view-today');
  const todayRows = (verdict?.subject_advice || []).filter(x => x.has_class_today);
  if (!todayRows.length) {
    el.innerHTML = '<h3>Today Advice</h3><p class="empty">No classes today. Chill.</p>';
    return;
  }
  el.innerHTML = '<h3>Today Advice</h3>' + todayRows.map(s => `
    <div class="row">
      <div>
        <div class="title">${s.name}</div>
        <div class="meta">${s.percentage}% · Semester bunk room: ${s.safe_bunks_left}</div>
      </div>
      ${s.skip_safe_today ? '<span class="pill ok">Can Bunk</span>' : '<span class="pill no">Attend</span>'}
    </div>
  `).join('');
}

function renderSubjects() {
  const el = document.getElementById('view-subjects');
  const byId = new Map((verdict?.subject_advice || []).map(x => [x.subject_id, x]));
  const rows = dashboard?.subjects || [];
  if (!rows.length) {
    el.innerHTML = '<h3>All Subjects</h3><p class="empty">No subjects found yet.</p>';
    return;
  }
  el.innerHTML = '<h3>All Subjects</h3>' + rows.map(s => {
    const ad = byId.get(s.id);
    const bunkLeft = ad?.safe_bunks_left ?? s.can_bunk ?? 0;
    return `
      <div class="row">
        <div>
          <div class="title">${s.name}</div>
          <div class="meta">${s.attended}/${s.total} attended</div>
        </div>
        <div class="right">
          <div class="title">${s.percentage}%</div>
          <div class="meta">Bunks left: ${bunkLeft}</div>
        </div>
      </div>
    `;
  }).join('');
}

function renderHolidays() {
  const el = document.getElementById('view-holidays');
  const rows = holidays?.rest_of_semester || [];
  if (!rows.length) {
    el.innerHTML = '<h3>Upcoming Holidays</h3><p class="empty">No holiday data yet. Add COE data and this fills up.</p>';
    return;
  }
  el.innerHTML = '<h3>Upcoming Holidays</h3>' + rows.map(h => `
    <div class="row">
      <div>
        <div class="title">${h.name}</div>
        <div class="meta">${h.day}</div>
      </div>
      <div class="title">${h.date}</div>
    </div>
  `).join('');
}

async function init() {
  if (!userId) return;
  const userRes = await fetch(`${API}/users/${userId}`);
  const user = await userRes.json();
  if (!user || user.error) return;
  if (!user.onboarded) {
    window.location.href = `onboarding.html?user_id=${userId}&name=${encodeURIComponent(user.name || '')}&email=${encodeURIComponent(user.email || '')}`;
    return;
  }

  document.getElementById('auth').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('hello').textContent = `${user.name || 'Student'} · Section ${user.section || '-'} · ${user.batch || '-'}`;

  const [dashRes, verdictRes, holidaysRes] = await Promise.all([
    fetch(`${API}/dashboard/${userId}`),
    fetch(`${API}/ai/verdict/${userId}`),
    fetch(`${API}/ai/holidays/${userId}`)
  ]);
  dashboard = await dashRes.json();
  verdict = await verdictRes.json();
  holidays = await holidaysRes.json();

  const totalBunks = (verdict.subject_advice || []).reduce((acc, s) => acc + (s.safe_bunks_left || 0), 0);
  const todayCount = (verdict.subject_advice || []).filter(x => x.has_class_today).length;

  document.getElementById('verdict').textContent = verdict.overall_verdict || 'No verdict yet';
  document.getElementById('today-summary').textContent = verdict.today_summary || '';
  document.getElementById('k-overall').textContent = `${dashboard.overall_percentage || 0}%`;
  document.getElementById('k-bunks').textContent = String(totalBunks);
  document.getElementById('k-today').textContent = String(todayCount);
  document.getElementById('k-days').textContent = String(verdict.days_left || 0);

  renderToday();
  renderSubjects();
  renderHolidays();
}

init().catch(() => {});
</script>
</body>
</html>
