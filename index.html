<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoBunk</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505; --card: #0c0c0c; --border: #1a1a1a; --text: #f2f2f2;
            --dim: #666666; --safe: #00ffa3; --danger: #ff4d4d; --warn: #ffcc00;
            --mono: 'JetBrains Mono', monospace; --sans: 'Space Grotesk', sans-serif;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.5; overflow-x: hidden; }
        
        /* Layout */
        .d-nav { height: 56px; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(5,5,5,0.8); backdrop-filter: blur(10px); z-index: 100; }
        .logo { font-family: var(--mono); font-weight: 700; color: var(--safe); }
        .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
        
        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: var(--card); border: 1px solid var(--border); padding: 1.5rem; border-radius: 16px; }
        .stat-label { font-size: 0.7rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; }
        .stat-val { font-family: var(--mono); font-size: 1.8rem; font-weight: 700; margin-top: 5px; }

        /* Verdict */
        .verdict-box { background: linear-gradient(135deg, #0e0e0e, #050505); border: 1px solid var(--border); border-left: 4px solid var(--safe); padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem; }
        .verdict-text { color: #bbb; font-size: 1rem; margin: 10px 0; }

        /* Subjects */
        .sub-card { background: var(--card); border: 1px solid var(--border); padding: 1.25rem; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .sub-name { font-weight: 600; font-size: 0.95rem; }
        .sub-pct { font-family: var(--mono); font-weight: 700; font-size: 1.2rem; }
        
        .green { color: var(--safe); }
        .red { color: var(--danger); }
        .yellow { color: var(--warn); }
        .hidden { display: none; }
    </style>
</head>
<body>

<nav class="d-nav">
    <div class="logo">NoBunk</div>
    <div id="user-display" style="font-size: 0.8rem; color: var(--dim)">Loading...</div>
</nav>

<div class="container">
    <div class="verdict-box">
        <div class="stat-label" style="color: var(--safe)">AI Analysis</div>
        <p class="verdict-text" id="v-text">Analyzing your attendance patterns...</p>
        <div id="v-today" style="font-family: var(--mono); font-size: 0.7rem; color: var(--dim)"></div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">Overall</div><div class="stat-val" id="stat-avg">--%</div></div>
        <div class="stat-card"><div class="stat-label">Bunks Available</div><div class="stat-val green" id="stat-bunks">0</div></div>
    </div>

    <h3 style="margin-bottom: 1rem; font-size: 0.8rem; color: var(--dim); text-transform: uppercase;">Your Inventory</h3>
    <div id="subject-list"></div>
</div>

<script>
const API = 'https://attendease-backend-wrag.onrender.com';
const userId = localStorage.getItem('user_id') || new URLSearchParams(window.location.search).get('user_id');

// Built-in Holidays for Even Sem 2025-26 
const HOLIDAYS = ["2026-02-15", "2026-03-19", "2026-03-21", "2026-03-31", "2026-04-03", "2026-04-04", "2026-04-14", "2026-04-18", "2026-04-19", "2026-04-20", "2026-05-01", "2026-05-16", "2026-05-28"];

async function init() {
    if (!userId) { window.location.href = 'index.html'; return; }
    
    // Check onboarding [cite: 13]
    const uRes = await fetch(`${API}/users/${userId}`);
    const user = await uRes.json();
    if (!user.onboarded) { window.location.href = `onboarding.html?user_id=${userId}`; return; }

    document.getElementById('user-display').textContent = user.name.toUpperCase();
    loadDashboard();
    loadVerdict();
}

async function loadDashboard() {
    const res = await fetch(`${API}/dashboard/${userId}`);
    const data = await res.json();
    
    document.getElementById('stat-avg').textContent = data.overall_percentage + '%';
    document.getElementById('stat-bunks').textContent = data.subjects.reduce((a, b) => a + (b.can_bunk || 0), 0);

    document.getElementById('subject-list').innerHTML = data.subjects.map(s => `
        <div class="sub-card">
            <div>
                <div class="sub-name">${s.name}</div>
                <div style="font-size: 0.7rem; color: var(--dim)">${s.can_bunk > 0 ? 'Safe to skip ' + s.can_bunk : 'Need ' + s.needs + ' classes'}</div>
            </div>
            <div class="sub-pct ${s.status === 'safe' ? 'green' : s.status === 'danger' ? 'red' : 'yellow'}">${s.percentage}%</div>
        </div>
    `).join('');
}

async function loadVerdict() {
    const res = await fetch(`${API}/ai/verdict/${userId}`);
    const d = await res.json();
    document.getElementById('v-text').textContent = d.overall_verdict + " " + (d.advice || "");
    document.getElementById('v-today').textContent = "TODAY: " + (d.today_summary || "No classes scheduled.");
}

init();
</script>
</body>
</html>
