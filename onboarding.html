<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoBunk — Setup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050505; --card: #111111; --border: rgba(255,255,255,0.08);
  --text: #ffffff; --muted: #666; --success: #00ff88; --warn: #ffaa00; --danger: #ff3366;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding: 0 1.25rem; }
.wrap { max-width:480px; margin:0 auto; padding-bottom: 2rem; }
.topbar { padding:1.5rem 0 1rem; display:flex; align-items:center; justify-content:space-between; }
.logo { font-family:'Montserrat',sans-serif; font-size:1rem; font-weight:900; color:var(--success); }
.progress-track { height:2px; background:rgba(255,255,255,0.06); margin-bottom:2.5rem; }
.progress-fill { height:100%; background:var(--success); transition:width 0.4s ease; }
.screen { display:none; }
.screen.active { display:block; }
.screen-title { font-family:'Montserrat',sans-serif; font-size:2rem; font-weight:900; margin-bottom:0.5rem; }
.screen-sub { color:var(--muted); font-size:0.9rem; margin-bottom:2rem; }
.field { margin-bottom:1.25rem; }
.field label { display:block; font-size:0.7rem; font-weight:700; color:var(--muted); margin-bottom:8px; text-transform:uppercase; }
.field select, .field input { width:100%; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:13px; color:#fff; outline:none; }
.field select:focus { border-color:var(--success); }
.subjects-box { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:1rem; margin-top:1rem; }
.subject-chip { display:inline-block; background:rgba(0,255,136,0.1); border:1px solid rgba(0,255,136,0.2); border-radius:20px; padding:4px 10px; font-size:0.75rem; color:var(--success); margin:3px; }
.att-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1rem; margin-bottom:10px; }
.att-card-name { font-weight:700; font-size:0.9rem; margin-bottom:10px; }
.att-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
.att-input-wrap input { width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:8px; padding:10px; color:#fff; text-align:center; font-weight:900; font-size:1.2rem; }
.btn-next { width:100%; background:var(--success); color:#000; border:none; border-radius:12px; padding:16px; font-family:'Montserrat',sans-serif; font-size:0.9rem; font-weight:800; cursor:pointer; margin-top:1.5rem; }
.btn-next:disabled { opacity:0.5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><div class="logo">NoBunk</div><div id="step-txt" style="font-size:0.7rem; color:var(--muted)">STEP 1/2</div></div>
  <div class="progress-track"><div class="progress-fill" id="prog" style="width:50%"></div></div>

  <div class="screen active" id="s1">
    <h1 class="screen-title">Setup Profile</h1>
    <p class="screen-sub">Exact subjects loaded for Chemistry Cycle (A-H).</p>
    <div class="field">
      <label>Section</label>
      <select id="section">
        <option value="A">Section A</option>
        </select>
    </div>
    <div class="field">
      <label>Batch</label>
      <select id="batch">
        <option value="A1">A1</option><option value="A2">A2</option><option value="A3">A3</option>
      </select>
    </div>
    <div class="subjects-box">
      <div id="chips"></div>
    </div>
    <button class="btn-next" id="b1" onclick="saveStep1()">Continue →</button>
  </div>

  <div class="screen" id="s2">
    <h1 class="screen-title">Current Stats</h1>
    <p class="screen-sub">Enter total classes held and classes you attended from the portal.</p>
    <div id="cards"></div>
    <button class="btn-next" id="b2" onclick="finishSetup()">Finish & Open Dashboard →</button>
  </div>
</div>

<script>
const API = 'https://attendease-backend-wrag.onrender.com';
const userId = new URLSearchParams(window.location.search).get('user_id');

// EXACT SUBJECTS FROM PDF 
const SUBJECTS = [
  "Applied Mathematics -II Numerical Methods",
  "Applied Chemistry for Smart systems",
  "Introduction to AI and Applications",
  "Introduction to Electrical Engineering",
  "Python Programming",
  "Communication skills",
  "Indian Constitution & Engineering Ethics",
  "Interdisciplinary Project based learning"
];

function init() {
  document.getElementById('chips').innerHTML = SUBJECTS.map(s => `<span class="subject-chip">${s}</span>`).join('');
}

async function saveStep1() {
  const btn = document.getElementById('b1');
  btn.disabled = true; btn.textContent = "Saving Profile...";
  
  const payload = {
    user_id: userId,
    college: "CMRIT",
    year: "1",
    semester: "2",
    section: document.getElementById('section').value,
    batch: document.getElementById('batch').value,
    min_attendance: 75
  };

  try {
    await fetch(`${API}/onboarding/profile`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    
    // Save timetable subjects [cite: 6]
    await fetch(`${API}/onboarding/save-timetable`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ user_id: userId, section: payload.section, subjects: SUBJECTS })
    });

    document.getElementById('s1').classList.remove('active');
    document.getElementById('s2').classList.add('active');
    document.getElementById('prog').style.width = "100%";
    document.getElementById('step-txt').textContent = "STEP 2/2";
    renderCards();
  } catch (e) { alert("Error saving. Try again."); btn.disabled = false; }
}

function renderCards() {
  document.getElementById('cards').innerHTML = SUBJECTS.map((s, i) => `
    <div class="att-card">
      <div class="att-card-name">${s}</div>
      <div class="att-grid">
        <div class="att-input-wrap"><label style="font-size:0.5rem; color:#666">TOTAL</label><input type="number" id="t-${i}" placeholder="0"></div>
        <div class="att-input-wrap"><label style="font-size:0.5rem; color:#666">ATTENDED</label><input type="number" id="a-${i}" placeholder="0"></div>
      </div>
    </div>
  `).join('');
}

async function finishSetup() {
  const btn = document.getElementById('b2');
  btn.disabled = true; btn.textContent = "Finalizing...";

  // Get subject IDs from dashboard first to link attendance
  const res = await fetch(`${API}/dashboard/${userId}`);
  const data = await res.json();
  const dbSubs = data.subjects;

  for (let i = 0; i < SUBJECTS.length; i++) {
    const total = parseInt(document.getElementById(`t-${i}`).value) || 0;
    const attended = parseInt(document.getElementById(`a-${i}`).value) || 0;
    if (total === 0) continue;

    const subId = dbSubs.find(s => s.name === SUBJECTS[i])?.id;
    if (!subId) continue;

    // Post summarized record (simplifying logic to avoid 100s of calls) [cite: 7]
    await fetch(`${API}/attendance`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ subject_id: subId, date: '2026-02-01', status: 'attended', count: attended }) 
    });
    await fetch(`${API}/attendance`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ subject_id: subId, date: '2026-02-01', status: 'bunked', count: (total - attended) })
    });
  }

  // CRITICAL: Ensure onboarded=true is set in DB [cite: 8, 13]
  await fetch(`${API}/users/${userId}`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ onboarded: true })
  });

  window.location.href = `index.html?user_id=${userId}`;
}

init();
</script>
</body>
</html>
