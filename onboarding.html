<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoBunk — Setup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f2ec;
  --card: #ffffff;
  --line: #ece3da;
  --text: #171311;
  --muted: #6a615a;
  --accent: #ff7a1a;
  --accent-soft: #fff0e3;
  --ok: #0b8a4b;
  --warn: #9f6700;
  --danger: #b42318;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding: 0 1.25rem; }
.wrap { max-width:560px; margin:0 auto; padding-bottom: 2rem; }
.topbar { padding:1.5rem 0 1rem; display:flex; align-items:center; justify-content:space-between; }
.logo { font-size:0.9rem; font-weight:900; letter-spacing:0.2em; text-transform:uppercase; color:var(--accent); }
.progress-track { height:4px; background:#f0e6dc; margin-bottom:2rem; border-radius:999px; overflow:hidden; }
.progress-fill { height:100%; background:var(--accent); transition:width 0.4s ease; }
.screen { display:none; }
.screen.active { display:block; }
.screen-title { font-size:2rem; font-weight:900; margin-bottom:0.5rem; letter-spacing:-0.02em; }
.screen-sub { color:var(--muted); font-size:0.9rem; margin-bottom:2rem; }
.field { margin-bottom:1.25rem; }
.field label { display:block; font-size:0.72rem; font-weight:700; color:var(--muted); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.08em; }
.field select, .field input {
  width:100%;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
  color:var(--text);
  outline:none;
}
.field select:focus, .field input:focus { border-color:var(--accent); }
.grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
.subjects-box { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1rem; margin-top:1rem; }
.subject-chip { display:inline-block; background:var(--accent-soft); border:1px solid #ffd7b5; border-radius:20px; padding:4px 10px; font-size:0.75rem; color:var(--accent); margin:3px; font-weight:700; }
.att-card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:1rem; margin-bottom:10px; }
.att-card-name { font-weight:700; font-size:0.9rem; margin-bottom:10px; }
.att-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
.att-input-wrap input { width:100%; background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px; color:var(--text); text-align:center; font-weight:900; font-size:1.2rem; }
.btn-next { width:100%; background:var(--accent); color:#fff; border:none; border-radius:12px; padding:16px; font-size:0.95rem; font-weight:800; cursor:pointer; margin-top:1.5rem; }
.btn-next:disabled { opacity:0.5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><div class="logo">NoBunk</div><div id="step-txt" style="font-size:0.7rem; color:var(--muted)">STEP 1/2</div></div>
  <div class="progress-track"><div class="progress-fill" id="prog" style="width:50%"></div></div>

  <div class="screen active" id="s1">
    <h1 class="screen-title">Setup Profile</h1>
    <p class="screen-sub">Step 1: basic details. Step 2: current attendance numbers.</p>
    <div class="field">
      <label>Name</label>
      <input id="name" type="text" placeholder="Your name">
    </div>
    <div class="field">
      <label>Year</label>
      <select id="year">
        <option value="1">1st Year</option>
      </select>
    </div>
    <div class="field">
      <label>Semester</label>
      <select id="semester">
        <option value="2">Semester 2</option>
      </select>
    </div>
    <div class="field">
      <label>Branch</label>
      <select id="branch">
        <option value="ISE">ISE</option>
        <option value="CSE">CSE</option>
        <option value="AIML">AIML</option>
        <option value="AIDS">AIDS</option>
        <option value="ECE">ECE</option>
      </select>
    </div>
    <div class="field">
      <label>Cycle</label>
      <select id="cycle">
        <option value="CHEM">Chemistry</option>
        <option value="PHYSICS_CSE">Physics (CSE/CSDS)</option>
        <option value="PHYSICS_ECE">Physics (ECE)</option>
      </select>
    </div>
    <div class="grid2">
      <div class="field">
        <label>Section</label>
        <select id="section" onchange="syncCycleFromSection()">
          <option value="A">Section A</option>
          <option value="B">Section B</option>
          <option value="C">Section C</option>
          <option value="D">Section D</option>
          <option value="E">Section E</option>
          <option value="F">Section F</option>
          <option value="G">Section G</option>
          <option value="H">Section H</option>
          <option value="I">Section I</option>
          <option value="J">Section J</option>
          <option value="K">Section K</option>
          <option value="L">Section L</option>
          <option value="M">Section M</option>
          <option value="N">Section N</option>
          <option value="O">Section O</option>
          <option value="P">Section P</option>
        </select>
      </div>
      <div class="field">
        <label>Batch</label>
        <select id="batch"></select>
      </div>
    </div>
    <div class="subjects-box">
      <div id="chips"></div>
    </div>
    <button class="btn-next" id="b1" onclick="saveStep1()">Continue →</button>
  </div>

  <div class="screen" id="s2">
    <h1 class="screen-title">Current Stats</h1>
    <p class="screen-sub">Enter total classes held and classes you attended from the portal.</p>
    <div id="cards"></div>
    <button class="btn-next" id="b2" onclick="finishSetup()">Finish & Open Dashboard →</button>
  </div>
</div>

<script>
const API = 'https://attendease-backend-wrag.onrender.com';
const userId = new URLSearchParams(window.location.search).get('user_id');
const userName = decodeURIComponent(new URLSearchParams(window.location.search).get('name') || localStorage.getItem('user_name') || '');

// EXACT SUBJECTS FROM PDF 
const SUBJECTS = [
  "Applied Mathematics -II Numerical Methods",
  "Applied Chemistry for Smart systems",
  "Introduction to AI and Applications",
  "Introduction to Electrical Engineering",
  "Python Programming",
  "Communication skills",
  "Indian Constitution & Engineering Ethics",
  "Interdisciplinary Project based learning"
];

function init() {
  document.getElementById('name').value = userName;
  syncCycleFromSection();
  document.getElementById('chips').innerHTML = SUBJECTS.map(s => `<span class="subject-chip">${s}</span>`).join('');
}

function syncCycleFromSection() {
  const section = (document.getElementById('section').value || 'A').toUpperCase();
  const batchSelect = document.getElementById('batch');
  batchSelect.innerHTML = `
    <option value="${section}1">${section}1</option>
    <option value="${section}2">${section}2</option>
    <option value="${section}3">${section}3</option>
  `;

  // Section is source of truth for cycle.
  if ('ABCDEFGH'.includes(section)) {
    document.getElementById('cycle').value = 'CHEM';
  } else if ('IJKL'.includes(section)) {
    document.getElementById('cycle').value = 'PHYSICS_CSE';
  } else {
    document.getElementById('cycle').value = 'PHYSICS_ECE';
  }
}

async function saveStep1() {
  const btn = document.getElementById('b1');
  btn.disabled = true; btn.textContent = "Saving Profile...";
  
  const payload = {
    user_id: userId,
    college: "CMRIT",
    year: document.getElementById('year').value,
    semester: document.getElementById('semester').value,
    section: document.getElementById('section').value,
    batch: document.getElementById('batch').value,
    min_attendance: 75
  };
  const name = (document.getElementById('name').value || '').trim();
  if (!name) {
    alert("Please enter your name.");
    btn.disabled = false;
    btn.textContent = "Continue →";
    return;
  }

  try {
    await fetch(`${API}/onboarding/profile`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    await fetch(`${API}/users/${userId}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name })
    });
    
    await fetch(`${API}/onboarding/save-timetable`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ user_id: userId, section: payload.section, subjects: SUBJECTS })
    });

    document.getElementById('s1').classList.remove('active');
    document.getElementById('s2').classList.add('active');
    document.getElementById('prog').style.width = "100%";
    document.getElementById('step-txt').textContent = "STEP 2/2";
    renderCards();
  } catch (e) { alert("Error saving. Try again."); btn.disabled = false; }
}

function renderCards() {
  document.getElementById('cards').innerHTML = SUBJECTS.map((s, i) => `
    <div class="att-card">
      <div class="att-card-name">${s}</div>
      <div class="att-grid">
        <div class="att-input-wrap"><label style="font-size:0.5rem; color:#666">TOTAL</label><input type="number" id="t-${i}" placeholder="0"></div>
        <div class="att-input-wrap"><label style="font-size:0.5rem; color:#666">ATTENDED</label><input type="number" id="a-${i}" placeholder="0"></div>
      </div>
    </div>
  `).join('');
}

async function finishSetup() {
  const btn = document.getElementById('b2');
  btn.disabled = true; btn.textContent = "Finalizing...";

  try {
    // Get subject IDs from dashboard first to link attendance
    const res = await fetch(`${API}/dashboard/${userId}`);
    const data = await res.json();
    const dbSubs = data.subjects || [];

    const startDate = new Date().toISOString().split('T')[0];

    for (let i = 0; i < SUBJECTS.length; i++) {
      const total = parseInt(document.getElementById(`t-${i}`).value) || 0;
      const attended = parseInt(document.getElementById(`a-${i}`).value) || 0;
      if (total === 0) continue;
      if (attended > total) {
        throw new Error(`Attended classes cannot exceed total for ${SUBJECTS[i]}`);
      }

      const subId = dbSubs.find(s => s.name === SUBJECTS[i])?.id;
      if (!subId) continue;

      await fetch(`${API}/attendance`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ subject_id: subId, date: startDate, status: 'attended', count: attended })
      });

      const bunked = total - attended;
      if (bunked > 0) {
        await fetch(`${API}/attendance`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ subject_id: subId, date: startDate, status: 'bunked', count: bunked })
        });
      }
    }

    // Ensure onboarded=true is set in DB
    await fetch(`${API}/users/${userId}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ onboarded: true })
    });

    window.location.href = `index.html?user_id=${userId}&name=${encodeURIComponent(name)}`;
  } catch (e) {
    alert(e.message || "Error finalizing setup. Try again.");
    btn.disabled = false;
    btn.textContent = "Finish & Open Dashboard →";
  }
}

init();
</script>
</body>
</html>
